<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" fill="none">
  <title>CoDesk — your ideas, inside Codex</title>
  <desc>A dark CoDesk illustration with a live counter example, editable frontend, backend and plugin folders, and the setup command.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11151E"/><stop offset="1" stop-color="#191F2C"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8DA9FF" fill-opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#canvas)"/>
  <rect width="1200" height="520" rx="24" fill="url(#dots)"/>
  <circle cx="1100" cy="62" r="210" fill="#8DA9FF" fill-opacity=".04"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="52" width="254" height="30" rx="15" fill="#191F2C" stroke="#30394C"/>
    <circle cx="74" cy="67" r="3" fill="#8DA9FF"/>
    <text x="86" y="71" fill="#A6B0C4" font-size="10" font-weight="700" letter-spacing="1.5">OPEN SOURCE. YOURS TO BUILD.</text>
    <text x="54" y="168" fill="#EDF1FC" font-size="62" font-weight="700" letter-spacing="-2.5">Your ideas.</text>
    <text x="54" y="236" fill="#8DA9FF" font-size="62" font-weight="700" letter-spacing="-2.5">Inside Codex.</text>
    <text x="56" y="283" fill="#A6B0C4" font-size="19">One command to get started.</text>
    <text x="56" y="313" fill="#A6B0C4" font-size="19">One repository to make it yours.</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8DA9FF">
      <rect x="56" y="350" width="78" height="34" rx="8" fill="#191F2C" stroke="#30394C"/>
      <text x="77" y="372">src/</text>
      <rect x="144" y="350" width="108" height="34" rx="8" fill="#191F2C" stroke="#30394C"/>
      <text x="163" y="372">worker/</text>
      <rect x="262" y="350" width="108" height="34" rx="8" fill="#191F2C" stroke="#30394C"/>
      <text x="281" y="372">plugin/</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="648" y="58" width="496" height="330" rx="18" fill="#191F2C" stroke="#30394C"/>
      <path d="M648 106H1144" stroke="#30394C"/>
      <circle cx="671" cy="82" r="4" fill="#30394C"/>
      <circle cx="685" cy="82" r="4" fill="#30394C"/>
      <circle cx="699" cy="82" r="4" fill="#30394C"/>
      <text x="1109" y="86" text-anchor="end" fill="#A6B0C4" font-size="11" letter-spacing="1">COUNTER EXAMPLE</text>
      <text x="680" y="146" fill="#EDF1FC" font-size="16" font-weight="700">Your first desk</text>
      <rect x="1038" y="127" width="74" height="26" rx="13" fill="#232F4B"/>
      <circle cx="1053" cy="140" r="3" fill="#8DA9FF"/>
      <text x="1063" y="144" fill="#8DA9FF" font-size="11">Live</text>
      <text x="896" y="266" text-anchor="middle" fill="#EDF1FC" font-size="106" font-weight="700" letter-spacing="-5">5</text>
      <text x="896" y="299" text-anchor="middle" fill="#A6B0C4" font-size="12">Same panel. New state.</text>
      <path d="M680 320H1112" stroke="#30394C"/>
      <path d="m686 344 6 6-6 6m14-6h10" stroke="#8DA9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="724" y="355" fill="#A6B0C4" font-size="14">Set the counter to 5.</text>
      <path d="m1087 350 6-6m-6 0h6v6" stroke="#A6B0C4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="56" y="422" width="1088" height="54" rx="12" fill="#11151E" stroke="#30394C"/>
    <text x="78" y="455" fill="#8DA9FF" font-family="Consolas, 'Courier New', monospace" font-size="15">$</text>
    <text x="102" y="455" fill="#EDF1FC" font-family="Consolas, 'Courier New', monospace" font-size="15">npm ci &amp;&amp; npm run setup</text>
    <text x="1118" y="454" text-anchor="end" fill="#A6B0C4" font-size="13">Log in → Name it → Deploy → Install</text>
  </g>
</svg>
